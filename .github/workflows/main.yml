name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            extension: .exe
          - os: macos-latest
            name: macos
            extension: ""
          - os: ubuntu-latest
            name: linux
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pynput "imgui[glfw]" PyOpenGL numpy psutil nuitka

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            ccache \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ccache

      - name: Locate glfw package folder
        shell: bash
        run: |
          echo "GLFW_DIR=$(python -c 'import glfw, os; print(os.path.dirname(glfw.__file__))')" >> "$GITHUB_ENV"

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m nuitka ^
            --onefile ^
            --enable-plugin=pyqt5 ^
            --include-package=imgui ^
            --include-package=OpenGL ^
            --include-package=pynput --include-package=numpy ^
            --include-data-dir=${{ env.GLFW_DIR }}=glfw ^
            --include-data-files=assets\mesa\opengl32.dll=opengl32.dll ^
            --include-data-files=assets\mesa\libgallium_wgl.dll=libgallium_wgl.dll ^
            --windows-console-mode=disable ^
            --windows-icon-from-ico=assets\icon.ico ^
            --assume-yes-for-downloads ^
            --output-filename=KeyStroke-windows.exe ^
            KeyStroke.pyw

      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          python -m nuitka \
            --mode=app \
            --enable-plugin=pyqt5 \
            --include-package=imgui \
            --include-package=OpenGL \
            --include-package=pynput --include-package=numpy \
            --include-data-dir=${{ env.GLFW_DIR }}=glfw \
            --macos-app-icon=assets/icon.icns \
            --output-filename=KeyStroke-macos \
            KeyStroke.pyw

      - name: List macOS build output (debug)
        if: runner.os == 'macOS'
        run: |
          echo "--- top-level ---"
          ls -la
          echo "--- any .app bundles ---"
          find . -maxdepth 3 -iname "*.app" -print

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --onefile \
            --enable-plugin=pyqt5 \
            --include-package=imgui \
            --include-package=OpenGL \
            --include-package=pynput --include-package=numpy \
            --include-data-dir=${{ env.GLFW_DIR }}=glfw \
            --output-filename=KeyStroke-linux \
            KeyStroke.pyw

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KeyStroke-windows
          path: KeyStroke-windows.exe

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: KeyStroke-macos
          path: '*.app'
          if-no-files-found: error

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: KeyStroke-linux
          path: KeyStroke-linux

  package:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      macos_zip: KeyStroke-macos.zip
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts (debug)
        run: find artifacts -maxdepth 3 -print

      - name: Package macOS app
        run: |
          cd artifacts/KeyStroke-macos
          zip -r ../../KeyStroke-macos.zip *.app

      - name: Upload zipped macOS build
        uses: actions/upload-artifact@v4
        with:
          name: KeyStroke-macos-zipped
          path: KeyStroke-macos.zip

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: KeyStroke-windows
          path: artifacts/windows

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: KeyStroke-linux
          path: artifacts/linux

      - name: Download zipped macOS build
        uses: actions/download-artifact@v4
        with:
          name: KeyStroke-macos-zipped
          path: artifacts/macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/KeyStroke-windows.exe
            artifacts/linux/KeyStroke-linux
            artifacts/macos/KeyStroke-macos.zip
          generate_release_notes: true