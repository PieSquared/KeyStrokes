name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pynput "imgui[glfw]" PyOpenGL numpy psutil nuitka

      - name: Build
        shell: cmd
        run: |
          python -m nuitka ^
            --onefile ^
            --enable-plugin=pyqt5 ^
            --include-package=imgui ^
            --include-package=OpenGL ^
            --include-package=pynput --include-package=numpy ^
            --include-data-files=assets\mesa\opengl32.dll=opengl32.dll ^
            --include-data-files=assets\mesa\libgallium_wgl.dll=libgallium_wgl.dll ^
            --windows-icon-from-ico=assets\icon.ico ^
            --assume-yes-for-downloads ^
            --output-filename=KeyStroke-windows.exe ^
            KeyStroke.pyw

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyStroke-windows
          path: KeyStroke-windows.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: KeyStroke-windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/KeyStroke-windows.exe
          generate_release_notes: true